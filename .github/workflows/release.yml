name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never

      # One release per tag with every artifact attached (electron-builder's own
      # publisher can create duplicate releases when uploading several files).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release/EzEng-Setup-*.exe
            release/EzEng-*-portable.exe
            release/latest.yml
          fail_on_unmatched_files: true
